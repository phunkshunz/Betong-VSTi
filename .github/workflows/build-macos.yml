name: Bygg BETONG för macOS och Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # behövs för att skapa releaser

jobs:
  # Manualen görs till PDF av Chrome och läggs i både Mac- och Windows-zippen.
  manual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gör PDF-manualen
        run: |
          mkdir -p dist
          google-chrome --headless=new --no-sandbox --disable-gpu --no-pdf-header-footer \
            --virtual-time-budget=20000 --run-all-compositor-stages-before-draw \
            --print-to-pdf="$PWD/dist/BETONG-Manual.pdf" "file://$PWD/manual/manual.html"
          test -s dist/BETONG-Manual.pdf

      - name: Ladda upp
        uses: actions/upload-artifact@v4
        with:
          name: BETONG-Manual
          path: dist/BETONG-Manual.pdf
          retention-days: 1

  macos:
    needs: manual
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Konfigurera
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Bygg
        run: cmake --build build --config Release -j 3

      - name: Hämta manualen
        uses: actions/download-artifact@v4
        with:
          name: BETONG-Manual
          path: dist/BETONG

      - name: Paketera
        run: |
          ART=build/Betong_artefacts/Release
          mkdir -p dist/BETONG
          cp -R "$ART/VST3/BETONG.vst3" dist/BETONG/
          cp -R "$ART/AU/BETONG.component" dist/BETONG/
          cp -R "$ART/Standalone/BETONG.app" dist/BETONG/
          cp scripts/installera.command dist/BETONG/
          chmod +x dist/BETONG/installera.command
          for b in dist/BETONG/BETONG.vst3 dist/BETONG/BETONG.component dist/BETONG/BETONG.app; do
            codesign --force --deep --sign - "$b"
          done
          cd dist && ditto -c -k --keepParent BETONG BETONG-macOS.zip

      - name: Ladda upp
        uses: actions/upload-artifact@v4
        with:
          name: BETONG-macOS
          path: dist/BETONG-macOS.zip
          retention-days: 1

  windows:
    # Bara Mac byggs automatiskt. Windows kan startas för hand under Actions.
    if: github.event_name == 'workflow_dispatch'
    needs: manual
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Konfigurera
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Bygg
        run: cmake --build build --config Release --parallel 4

      - name: Hämta manualen
        uses: actions/download-artifact@v4
        with:
          name: BETONG-Manual
          path: dist/BETONG

      - name: Paketera
        shell: pwsh
        run: |
          $ART = "build/Betong_artefacts/Release"
          New-Item -ItemType Directory -Force dist/BETONG | Out-Null
          Copy-Item -Recurse "$ART/VST3/BETONG.vst3" dist/BETONG/
          Copy-Item "$ART/Standalone/BETONG.exe" dist/BETONG/
          Copy-Item scripts/installera.bat dist/BETONG/
          Compress-Archive -Path dist/BETONG -DestinationPath dist/BETONG-Windows.zip

      - name: Ladda upp
        uses: actions/upload-artifact@v4
        with:
          name: BETONG-Windows
          path: dist/BETONG-Windows.zip
          retention-days: 1

  # Varje bygge på main blir en release, så att
  # .../releases/latest/download/BETONG-macOS.zip och BETONG-Windows.zip
  # alltid ger senaste versionen.
  release:
    if: github.event_name == 'push'
    needs: [manual, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Skapa release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('bygge-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('BETONG bygge {0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: "Ladda ner BETONG-macOS.zip (Mac) eller BETONG-Windows.zip (Windows) nedan. Installera enligt README. Manualen ligger i zippen och som PDF här."
          files: |
            dist/BETONG-macOS.zip
            dist/BETONG-Manual.pdf
