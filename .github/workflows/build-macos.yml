name: Bygg maskinerna för macOS och Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # behövs för att skapa releaser

jobs:
  # Snabbkontroll: maskinerna måste ha egna namn, plugin-koder och bundle-id:n,
  # annars kan DAW:en blanda ihop dem. Se tools/check_machines.py.
  kontroll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Kontrollera maskinerna
        run: python3 tools/check_machines.py

  # Manualen görs till PDF av Chrome och läggs i både Mac- och Windows-zippen.
  manual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gör PDF-manualen
        run: |
          mkdir -p dist
          google-chrome --headless=new --no-sandbox --disable-gpu --no-pdf-header-footer \
            --virtual-time-budget=20000 --run-all-compositor-stages-before-draw \
            --print-to-pdf="$PWD/dist/BETONG-Manual.pdf" "file://$PWD/manual/manual.html"
          test -s dist/BETONG-Manual.pdf

      - name: Ladda upp
        uses: actions/upload-artifact@v4
        with:
          name: BETONG-Manual
          path: dist/BETONG-Manual.pdf
          retention-days: 1

  macos:
    needs: [manual, kontroll]
    runs-on: macos-14
    env:
      # CMake-målen, samma lista som BETONG_MACHINES i CMakeLists.txt.
      # tools/check_machines.py kontrollerar att de stämmer.
      MASKINER: "Betong Smidet"
    steps:
      - uses: actions/checkout@v4

      - name: Konfigurera
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0

      - name: Bygg
        run: cmake --build build --config Release -j 3

      - name: Hämta manualen
        uses: actions/download-artifact@v4
        with:
          name: BETONG-Manual
          path: dist/BETONG

      - name: Paketera
        run: |
          mkdir -p dist/BETONG
          for m in $MASKINER; do
            ART=build/${m}_artefacts/Release
            cp -R "$ART/VST3/"*.vst3 dist/BETONG/
            cp -R "$ART/AU/"*.component dist/BETONG/
            cp -R "$ART/Standalone/"*.app dist/BETONG/
          done
          cp scripts/installera.command dist/BETONG/
          chmod +x dist/BETONG/installera.command
          for b in dist/BETONG/*.vst3 dist/BETONG/*.component dist/BETONG/*.app; do
            codesign --force --deep --sign - "$b"
          done
          cd dist && ditto -c -k --keepParent BETONG BETONG-macOS.zip

      - name: Ladda upp
        uses: actions/upload-artifact@v4
        with:
          name: BETONG-macOS
          path: dist/BETONG-macOS.zip
          retention-days: 1

  windows:
    # Bara Mac byggs automatiskt. Windows kan startas för hand under Actions.
    if: github.event_name == 'workflow_dispatch'
    needs: [manual, kontroll]
    runs-on: windows-2022
    env:
      MASKINER: "Betong Smidet"
    steps:
      - uses: actions/checkout@v4

      - name: Konfigurera
        run: cmake -B build -G "Visual Studio 17 2022" -A x64

      - name: Bygg
        run: cmake --build build --config Release --parallel 4

      - name: Hämta manualen
        uses: actions/download-artifact@v4
        with:
          name: BETONG-Manual
          path: dist/BETONG

      - name: Paketera
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/BETONG | Out-Null
          foreach ($m in $env:MASKINER.Split(' ')) {
            $ART = "build/${m}_artefacts/Release"
            Copy-Item -Recurse "$ART/VST3/*.vst3" dist/BETONG/
            Copy-Item "$ART/Standalone/*.exe" dist/BETONG/
          }
          Copy-Item scripts/installera.bat dist/BETONG/
          Compress-Archive -Path dist/BETONG -DestinationPath dist/BETONG-Windows.zip

      - name: Ladda upp
        uses: actions/upload-artifact@v4
        with:
          name: BETONG-Windows
          path: dist/BETONG-Windows.zip
          retention-days: 1

  # Varje bygge på main blir en release, så att
  # .../releases/latest/download/BETONG-macOS.zip och BETONG-Windows.zip
  # alltid ger senaste versionen.
  release:
    if: github.event_name == 'push'
    needs: [manual, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Skapa release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('bygge-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('BETONG bygge {0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: "Zippen innehåller två maskiner, BETONG och SMIDET, och båda ligger under tillverkaren Phunkshunz i DAW:en. Ladda ner BETONG-macOS.zip (Mac) eller BETONG-Windows.zip (Windows) nedan. Installera enligt README. Manualen ligger i zippen och som PDF här."
          files: |
            dist/BETONG-macOS.zip
            dist/BETONG-Manual.pdf
